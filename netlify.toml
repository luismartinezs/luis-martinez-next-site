# Netlify builds this Zola site on push. ./build compiles src/*.ts with the pinned TypeScript, then runs Zola.
[build]
  command = "./build"
  publish = "public"

[build.environment]
  ZOLA_VERSION = "0.23.6"
  NODE_VERSION = "24"
  # The Next.js runtime plugin is still attached to this Netlify site from its Next.js days.
  # Skip it until it is removed in the dashboard (Project configuration > Build & deploy > Plugins).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[context.deploy-preview]
  command = "./build --base-url $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "./build --base-url $DEPLOY_PRIME_URL"

# Fingerprinted or content-addressed assets can be cached for a long time.
[[headers]]
  for = "/processed_images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker kill switch must never be cached, or old clients will not pick it up.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
